services:
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  producer:
    build: ./producer
    env_file: .env
    depends_on:
      kafka: { condition: service_healthy }
    restart: unless-stopped

  spark:
    build: ./spark
    env_file: .env
    volumes: [lake:/data]
    depends_on:
      kafka: { condition: service_healthy }
    ports: ["4040:4040"]   # Spark UI
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    env_file: .env
    volumes: [lake:/data:ro]
    ports: ["8501:8501"]
    depends_on: [spark]

  # One-off transformations: `make transform`
  dbt:
    image: python:3.11-slim
    profiles: ["tools"]
    working_dir: /dbt
    env_file: .env
    volumes: [lake:/data, ./dbt:/dbt]
    entrypoint: ["sh", "-c", "pip install -q dbt-duckdb==1.8.1 && dbt build --profiles-dir ."]

  # Scheduled orchestration: `make airflow` (UI on http://localhost:8080)
  airflow:
    image: apache/airflow:2.9.3-python3.11
    profiles: ["orchestration"]
    user: "0:0"
    command: standalone
    env_file: .env
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "dbt-duckdb==1.8.1 duckdb==1.1.3"
    volumes:
      - lake:/data
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
    ports: ["8080:8080"]

volumes:
  lake:
